# CI/CD for the sales — listings and purchases service.
#   pull_request  -> build, test, and refuse to go green below 80% line coverage
#   push to main  -> the same gate, then publish the image and roll out the k8s manifests
#
# Deployment is therefore driven by pull requests: nothing reaches the cluster until a PR is
# merged into main.
name: sales — listings and purchases

on:
  pull_request:
    branches: [main]
    paths:
      - "sales/**"
      - ".github/workflows/sales.yml"
      - "global.json"
      - "coverage.runsettings"
  push:
    branches: [main]
    paths:
      - "sales/**"
      - ".github/workflows/sales.yml"
      - "global.json"
      - "coverage.runsettings"
  workflow_dispatch:

env:
  SOLUTION: sales/FiapSub.Sales.slnx
  MIN_LINE_COVERAGE: "80"
  IMAGE_NAME: fiapsub-sales

concurrency:
  group: sales — listings and purchases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('sales/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION --configuration Release --no-restore -warnaserror

      # The integration tests start a throwaway Postgres with Testcontainers; the ubuntu runner
      # already has a Docker daemon, so no extra service container is needed.
      - name: Test with coverage
        run: |
          dotnet test --solution $SOLUTION \
            --configuration Release --no-build \
            --coverage --coverage-settings coverage.runsettings \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml

      - name: Build the coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"sales/tests/**/TestResults/coverage.cobertura.xml" \
            -targetdir:coveragereport \
            -reporttypes:"Html;Cobertura;TextSummary;MarkdownSummaryGithub"

      # One tool end to end, so the comparison cannot depend on the runner's locale.
      - name: Enforce the coverage threshold
        run: |
          python3 - <<'PYEOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          rate = float(ET.parse("coveragereport/Cobertura.xml").getroot().get("line-rate")) * 100
          minimum = float(os.environ["MIN_LINE_COVERAGE"])

          print(f"Line coverage: {rate:.2f}% (minimum {minimum:.0f}%)")

          if rate < minimum:
              sys.exit(f"Coverage gate failed: {rate:.2f}% is below {minimum:.0f}%.")
          PYEOF

      - name: Publish the coverage summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      # Downloadable evidence of the coverage requirement, for the demo video.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-coverage-report
          path: coveragereport/
          retention-days: 30

  deploy:
    name: Publish and deploy
    needs: build-and-test
    # Only a merge into main deploys. A pull request runs the gate and stops there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sales/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The rollout is skipped — not failed — when no cluster is configured, so the pipeline is
      # green on a fresh fork. Add a KUBE_CONFIG secret (base64 kubeconfig) to enable it.
      - name: Check for a cluster
        id: cluster
        run: echo "configured=${{ secrets.KUBE_CONFIG != '' }}" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        if: steps.cluster.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Roll out the deployment and service
        if: steps.cluster.outputs.configured == 'true'
        run: |
          kubectl apply -f sales/k8s/namespace.yaml
          kubectl apply -f sales/k8s/configmap.yaml
          kubectl apply -f sales/k8s/postgres.yaml
          kubectl apply -f sales/k8s/service.yaml
          kubectl apply -f sales/k8s/deployment.yaml
          kubectl apply -f sales/k8s/hpa.yaml
          kubectl apply -f sales/k8s/ingress.yaml

          # Point the deployment at the image this run just pushed.
          kubectl --namespace fiap-sub set image deployment/sales-api \
            api=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

          kubectl --namespace fiap-sub rollout status deployment/sales-api --timeout=5m

      - name: Report a skipped rollout
        if: steps.cluster.outputs.configured != 'true'
        run: |
          {
            echo "### Rollout skipped"
            echo
            echo "The image was published to GHCR, but no \`KUBE_CONFIG\` secret is configured,"
            echo "so \`kubectl apply -f sales/k8s/\` did not run."
          } >> "$GITHUB_STEP_SUMMARY"
