# CI/CD for the sales — listings and purchases service.
#   pull_request  -> build, test, and refuse to go green below 80% line coverage
#   push to main  -> the same gate, then publish the image, roll out the k8s manifests and
#                    smoke-test the deployment (on KUBE_CONFIG's cluster, or an ephemeral kind one)
#
# Deployment is therefore driven by pull requests: nothing reaches the cluster until a PR is
# merged into main.
#
# Every path below is derived from SERVICE_DIR, so delivering this service as its own repository
# needs exactly one edit here: set SERVICE_DIR to "." (see the split section of the root README).
# There is deliberately no `paths:` filter — one would silently stop matching after that move,
# and a workflow that never fires looks the same as no CI at all.
name: sales — listings and purchases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_DIR: sales
  SOLUTION_NAME: FiapSub.Sales.slnx
  MIN_LINE_COVERAGE: "80"
  IMAGE_NAME: fiapsub-sales

concurrency:
  group: sales — listings and purchases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ env.SERVICE_DIR }}/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles(format('{0}/Directory.Packages.props', env.SERVICE_DIR)) }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$SOLUTION_NAME"

      - name: Build
        run: dotnet build "$SOLUTION_NAME" --configuration Release --no-restore -warnaserror

      # The integration tests start a throwaway Postgres with Testcontainers; the ubuntu runner
      # already has a Docker daemon, so no extra service container is needed.
      #
      # Every test project writes into one explicit results directory, and with no
      # --coverage-output each one gets its own unique file name. Where results land by default
      # differs between SDK feature bands (10.0.1xx: each project's bin/; 10.0.4xx: a shared
      # ./TestResults, where a fixed file name made the projects overwrite each other).
      - name: Test with coverage
        run: |
          dotnet test --solution "$SOLUTION_NAME" \
            --configuration Release --no-build \
            --results-directory "$PWD/TestResults" \
            --coverage --coverage-settings coverage.runsettings \
            --coverage-output-format cobertura

      - name: Build the coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/*.cobertura.xml" \
            -targetdir:coveragereport \
            -reporttypes:"Html;Cobertura;TextSummary;MarkdownSummaryGithub"

      # One tool end to end, so the comparison cannot depend on the runner's locale.
      - name: Enforce the coverage threshold
        run: |
          python3 - <<'PYEOF'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          # A gate over fewer reports than test projects would measure only part of the code.
          projects = len(glob.glob("tests/*/*.csproj"))
          reports = len(glob.glob("TestResults/*.cobertura.xml"))
          print(f"Coverage reports: {reports} from {projects} test projects")
          if reports < projects:
              sys.exit(f"Coverage gate failed: expected {projects} coverage reports, found {reports}.")

          rate = float(ET.parse("coveragereport/Cobertura.xml").getroot().get("line-rate")) * 100
          minimum = float(os.environ["MIN_LINE_COVERAGE"])

          print(f"Line coverage: {rate:.2f}% (minimum {minimum:.0f}%)")

          if rate < minimum:
              sys.exit(f"Coverage gate failed: {rate:.2f}% is below {minimum:.0f}%.")
          PYEOF

      - name: Publish the coverage summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      # Downloadable evidence of the coverage requirement, for the demo video.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-coverage-report
          path: ${{ env.SERVICE_DIR }}/coveragereport/
          retention-days: 30

  deploy:
    name: Publish and deploy
    needs: build-and-test
    # Only a merge into main deploys. A pull request runs the gate and stops there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile takes the service folder as its context, so this is the only
          # reference that has to know where the service lives.
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR wants a lowercase owner; metadata-action lowercases the tags it pushes, so match it.
      - name: Name the image this run pushed
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      # A merge always ends in a real deployment. With a KUBE_CONFIG secret (base64 kubeconfig)
      # it goes to that cluster; without one, to a throwaway kind cluster on the runner, so the
      # manifests are still applied, rolled out and smoke-tested on every merge.
      - name: Choose the cluster
        id: cluster
        run: echo "external=${{ secrets.KUBE_CONFIG != '' }}" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl for the external cluster
        if: steps.cluster.outputs.external == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create a kind cluster
        if: steps.cluster.outputs.external != 'true'
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: fiap-sub

      # The GHCR package is private by default and kind has no credentials for it, so hand the
      # cluster the image this run just pushed.
      - name: Load the image into kind
        if: steps.cluster.outputs.external != 'true'
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name fiap-sub

      # Applies every manifest, creates the secrets, waits for the rollout and smoke-tests the
      # Service. Secrets left unset are generated on the first deploy and kept afterwards.
      # INTERNAL_TOKEN must hold the same value in both services' repositories.
      - name: Deploy and smoke-test
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          REGISTRY_PULL_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: ./scripts/deploy.sh

      - name: Report the deployment
        run: |
          if [[ "${{ steps.cluster.outputs.external }}" == "true" ]]; then
            target="the cluster in \`KUBE_CONFIG\`"
          else
            target="an ephemeral kind cluster on the runner (add a \`KUBE_CONFIG\` secret to deploy to your own)"
          fi
          {
            echo "### Deployment"
            echo
            echo "Image \`${IMAGE}\` rolled out to ${target}."
          } >> "$GITHUB_STEP_SUMMARY"
