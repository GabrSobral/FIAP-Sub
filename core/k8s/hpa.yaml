# The brief calls for the listing and purchase endpoints to absorb a sudden spike in traffic.
# That is what this autoscaler is for, and why those endpoints live in their own service with
# their own database: scaling here never adds load to the other service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: fiap-sub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
