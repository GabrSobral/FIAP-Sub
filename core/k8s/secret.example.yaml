# Template only — do NOT commit real values. Create the real secret out of band, e.g.
#   kubectl -n fiap-sub create secret generic core-api-secrets \
#     --from-literal=Database__ConnectionString='Host=core-db;Port=5432;Database=fiapsub_core;Username=fiapsub;Password=<password>' \
#     --from-literal=InternalApi__Token='<shared-token>' \
#     --from-literal=SalesService__InternalToken='<shared-token>'
#
# InternalApi__Token and SalesService__InternalToken must hold the same value in both services:
