# Serves the built SPA and proxies the two APIs under same-origin prefixes. Doing it here means
# the browser never makes a cross-origin request, so neither service needs CORS enabled — and the
# URLs are identical to the ones Vite's dev proxy serves.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a deploy goes unnoticed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /core-api/ {
        proxy_pass http://core-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The browser has no business reaching the service-to-service routes.
        location ~ ^/core-api/api/internal {
            return 404;
        }
    }

    location /sales-api/ {
        proxy_pass http://sales-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/sales-api/api/internal {
            return 404;
        }
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
