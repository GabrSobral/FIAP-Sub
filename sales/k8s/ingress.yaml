# Only the public routes are exposed: the listings, the purchase and Swagger.
# The /api/internal routes have no rule here, so they are reachable only inside the cluster,
# through the ClusterIP service, and are additionally guarded by the shared token.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-api
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: sales-api
    app.kubernetes.io/part-of: fiap-sub
spec:
  ingressClassName: nginx
  rules:
    - host: sales.fiap-sub.local
      http:
        paths:
          - path: /api/vehicles
            pathType: Prefix
            backend:
              service:
                name: sales-api
                port:
                  name: http
          - path: /api/sales
            pathType: Prefix
            backend:
              service:
                name: sales-api
                port:
                  name: http
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: sales-api
                port:
                  name: http
