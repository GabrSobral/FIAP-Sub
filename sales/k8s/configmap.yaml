# Non-secret settings. Double underscores are how ASP.NET Core reads nested configuration
# ("Database__RunMigrationsOnStartup" binds to Database:RunMigrationsOnStartup).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-api-config
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: sales-api
    app.kubernetes.io/part-of: fiap-sub
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  Database__RunMigrationsOnStartup: "true"
  Database__MaxRetryCount: "8"
  CatalogueService__BaseUrl: "http://core-api.fiap-sub.svc.cluster.local:8080"
  CatalogueService__AttemptTimeoutSeconds: "5"
  CatalogueService__RetryCount: "3"
  InternalApi__PathPrefix: "/api/internal"
