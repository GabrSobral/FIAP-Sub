# Template only — do NOT commit real values. Create the real secret out of band, e.g.
#   kubectl -n fiap-sub create secret generic sales-api-secrets \
#     --from-literal=Database__ConnectionString='Host=sales-db;Port=5432;Database=fiapsub_sales;Username=fiapsub;Password=<password>' \
#     --from-literal=InternalApi__Token='<shared-token>' \
#     --from-literal=CatalogueService__InternalToken='<shared-token>'
#
# InternalApi__Token and CatalogueService__InternalToken must hold the same value in both services:
