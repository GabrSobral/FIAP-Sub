apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-api
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: sales-api
    app.kubernetes.io/part-of: fiap-sub
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: sales-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-api
        app.kubernetes.io/part-of: fiap-sub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: api
          # CI replaces this tag with the digest it just pushed (kubectl set image).
          image: ghcr.io/OWNER/fiapsub-sales:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sales-api-config
            - secretRef:
                name: sales-api-secrets
          # Liveness only asks whether the process is alive, so a database blip cannot trigger a
          # restart loop; readiness is what takes a pod out of the Service.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            # Generous: the first pod of a rollout applies the EF Core migrations.
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
