# This service's own database. It is a separate StatefulSet with its own volume, which is what
# "segregated database" means here: the other service has no route to this data.
apiVersion: v1
kind: Service
metadata:
  name: sales-db
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: sales-db
    app.kubernetes.io/part-of: fiap-sub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sales-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sales-db
  namespace: fiap-sub
  labels:
    app.kubernetes.io/name: sales-db
    app.kubernetes.io/part-of: fiap-sub
spec:
  serviceName: sales-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sales-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-db
        app.kubernetes.io/part-of: fiap-sub
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: sales-db-credentials
          env:
            # The volume is mounted one level up so Postgres owns an empty subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=fiapsub", "--dbname=fiapsub_sales"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "--username=fiapsub", "--dbname=fiapsub_sales"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
